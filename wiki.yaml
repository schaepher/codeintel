project:
  description: codeintel —— Go 代码库智能索引与查询系统（静态分析产出 SQLite 代码图，CLI/服务/MCP 查询）
modules:
  - name: github.com/schaepher/codeintel
    description: 核心：索引构建（ssa/ast/scip/git 四适配器）+ 查询（symbol/字段追溯/表关联/意图命令）+ 服务（serve/MCP/CLI）
tables:
  - name: nodes
    alias: 代码节点
  - name: edges
    alias: 关系边
  - name: build_metadata
    alias: 构建元数据
  - name: nodes
    columns:
      - name: id
        type: TEXT
        comment: Canonical ID（主键）
      - name: kind
        type: TEXT
        comment: 节点类型（function/method/struct/package 等）
      - name: name
        type: TEXT
        comment: 符号名
      - name: file_path
        type: TEXT
        comment: 源文件相对路径
      - name: line_start
        type: INTEGER
        comment: 定义起始行
      - name: line_end
        type: INTEGER
        comment: 定义结束行
      - name: properties
        type: JSON
        comment: 扩展属性（签名/文档/服务标记等）
    indexes:
      - idx_nodes_name(name)
      - idx_nodes_file_kind(file_path, kind)
      - idx_nodes_signature(signature_text)
    ddl: |
      CREATE TABLE nodes (
        id TEXT PRIMARY KEY,
        kind TEXT NOT NULL,
        name TEXT NOT NULL,
        file_path TEXT,
        line_start INTEGER,
        line_end INTEGER,
        properties JSON
      )
  - name: edges
    columns:
      - name: id
        type: INTEGER
        comment: 自增主键
      - name: source_id
        type: TEXT
        comment: 起点节点（外键 → nodes.id）
      - name: target_id
        type: TEXT
        comment: 终点节点（外键 → nodes.id）
      - name: kind
        type: TEXT
        comment: 边类型（calls/imports/modified_by 等）
      - name: confidence
        type: REAL
        comment: 置信度（SCIP=1.0 / AST=0.8 / Git=1.0）
      - name: metadata
        type: JSON
        comment: 扩展属性（调用点/条件等）
    indexes:
      - idx_edges_source_kind(source_id, kind)
      - idx_edges_target_kind(target_id, kind)
    ddl: |
      CREATE TABLE edges (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        source_id TEXT NOT NULL,
        target_id TEXT NOT NULL,
        kind TEXT NOT NULL,
        confidence REAL NOT NULL DEFAULT 0.5,
        metadata JSON,
        FOREIGN KEY (source_id) REFERENCES nodes(id) ON DELETE CASCADE,
        FOREIGN KEY (target_id) REFERENCES nodes(id) ON DELETE CASCADE,
        UNIQUE(source_id, target_id, kind)
      )
glossary:
  - term: ssa
    definition: 静态单赋值——编译器中间表示，用于字段级数据流追溯（谁写入/谁读取）
  - term: ast
    definition: 抽象语法树——源码结构分析（调用关系/服务入口标记）
  - term: scip
    definition: 代码索引协议（scip-go 生成符号定义索引）
  - term: ER
    definition: 实体关系——数据库表与列、表间关联的可视化
  - term: MCP
    definition: Model Context Protocol——AI 代理调用 codeintel 查询能力的接口
  - term: 意图命令
    definition: before（改前影响预判）/ trace（数据来龙去脉）等业务语义查询
architecture: |
  graph LR
    SRC[Go 源码] --> A1[ssa 适配器]
    SRC --> A2[ast 适配器]
    SRC --> A3[scip 索引]
    SRC --> A4[git 历史]
    A1 --> DB[(codeintel.db)]
    A2 --> DB
    A3 --> DB
    A4 --> DB
    DB --> CLI[CLI 查询]
    DB --> WEB[serve 网页]
    DB --> MCP[MCP 服务]
flows:
  - title: init 构建流程
    mermaid: |
      sequenceDiagram
        用户->>CLI: codeintel init --repo
        CLI->>分析器: 并行分析（ssa/ast/scip/git）
        分析器->>DB: 写入节点与边
        CLI->>用户: 构建报告与引导示例
  - title: 字段追溯流程
    mermaid: |
      sequenceDiagram
        用户->>CLI: query trace-backward 字段
        CLI->>DB: 值流全链查询
        DB->>CLI: 产生点/写入方（带行号）
        CLI->>用户: 追溯链展示
